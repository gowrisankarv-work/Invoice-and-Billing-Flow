# Settings shared by every environment. Environment-specific values live in application-<profile>.yml
# and are supplied through environment variables outside of local development.
spring:
  application:
    name: invoiceflow
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      enabled: false
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
      # Store BigDecimal as Decimal128 so amounts stay numeric and exact in MongoDB.
      representation:
        big-decimal: decimal128
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Access tokens must carry the tenant_id and roles claims (see JwtClaims).
          issuer-uri: ${JWT_ISSUER_URI}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

invoiceflow:
  storage:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:invoiceflow-documents}
